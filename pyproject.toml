[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-helper"
version = "0.1.0"
description = "Local market analysis and portfolio monitoring helper for Interactive Brokers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ib-insync>=0.9.86",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
