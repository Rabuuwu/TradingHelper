[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-helper"
version = "0.4.0"
description = "Broker-independent market analysis and manual portfolio assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pandas>=2.2", "numpy>=1.26", "python-dotenv>=1.0", "PyYAML>=6.0", "requests>=2.32", "bcrypt>=4.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
trading-helper = "trading_helper.main:main"
trading-helper-companion = "trading_helper.desktop_companion:run_companion"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_helper = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
