name: Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and desktop dependencies
        run: python -m pip install -e ".[dev,desktop]"
      - name: Run lint and tests
        shell: pwsh
        run: |
          ruff check src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -m "not e2e" -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows application
        shell: pwsh
        run: ./scripts/build_windows_app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TradingHelper-windows-x64
          path: dist/windows/TradingHelper-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
